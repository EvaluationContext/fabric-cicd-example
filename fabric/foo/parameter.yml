# Env-specific rewrites applied by fab deploy (fabric-cicd) at publish time.
# Env keys must match config.yml. `_ALL_` applies to every environment and
# must be the only key when used.
# Docs: https://microsoft.github.io/fabric-cicd/1.3.0/how_to/parameterization/
#
# Only what fabric-cicd cannot bind on its own is here. Before it publishes a
# definition file it does two rewrites of its own, no rule needed:
#
#   1. Every logicalId from an item's .platform found in any file is replaced
#      with that item's id in the target workspace. Items are published in
#      dependency order (Lakehouse before Notebook before DataPipeline), so the
#      referenced item always exists first.
#   2. `workspaceId`, `default_lakehouse_workspace_id` and `workspace` values
#      equal to 00000000-0000-0000-0000-000000000000 are replaced with the
#      target workspace id. A real guid in those fields is left alone.
#
# That is exactly how Fabric Git integration writes same-workspace references
# (https://learn.microsoft.com/fabric/cicd/cross-workspace-dependency-binding),
# so the repo stores them that way:
#
#   Notebook → Lakehouse       default_lakehouse / known_lakehouses = Sales.Lakehouse logicalId,
#                              default_lakehouse_workspace_id = zero guid
#   Pipeline → Notebook        notebookId = Load Sales.Notebook logicalId, workspaceId = zero guid
#   Report   → Semantic model  definition.pbir byPath; fabric-cicd converts it to byConnection
#
# Two things need rules below. The semantic model's Direct Lake SQL endpoint
# host and id have no logicalId to bind through. And the notebook's lakehouse
# references would be fine in the repo, but the commit back from a feature
# workspace rewrites them to that workspace's real ids, and a real guid in
# those fields is left alone by fabric-cicd. Without the notebook rules, every
# environment's notebook would point at a feature workspace that no longer exists.
#
# Every rule is `is_regex` with exactly one capture group, anchored on the
# STRUCTURE around the value rather than on the committed value. The literals
# change on every feature branch: the binding deploy commits the feature
# workspace's ids back to the branch, and the merge carries them to main. A
# find_value matched on dev's literal would stop matching after the first
# merge; anchored on the surrounding structure it matches whatever the last
# commit left there. Only the captured group is replaced. A malformed pattern
# rejects the whole file.
#
# `_ALL_` covers the feature environment too. A rule with a per-environment
# replace_value needs a `feature` key, or it skips the file with a warning.

find_replace:

  # ---- Semantic model → Lakehouse SQL analytics endpoint ---------------------
  # Direct Lake on SQL: Sql.Database("<endpoint host>", "<endpoint id>").
  # The SQL endpoint is not an item in the repo, so there is no logicalId to
  # bind through; both values are carried as literals in expressions.tmdl.
  # Two disjoint matches, so neither rule depends on the other having run.

  - find_value: 'Sql\.Database\("([^"]+)",'
    is_regex: "true"
    replace_value:
      _ALL_: "$items.Lakehouse.Sales.$sqlendpoint"
    item_type: "SemanticModel"
    item_name: "Sales"
    file_path: "/Sales.SemanticModel/definition/expressions.tmdl"

  - find_value: 'Sql\.Database\("[^"]+",\s*"([0-9a-fA-F-]{36})"\)'
    is_regex: "true"
    replace_value:
      _ALL_: "$items.Lakehouse.Sales.$sqlendpointid"
    item_type: "SemanticModel"
    item_name: "Sales"
    file_path: "/Sales.SemanticModel/definition/expressions.tmdl"

  # ---- Notebook → Lakehouse, after a commit back ------------------------------
  # The notebook's # META block holds the default lakehouse, its workspace and
  # the known lakehouses. Fabric writes real ids there on the commit back, so
  # all three are rebound to the workspace being deployed to. The default
  # lakehouse is a lakehouse in the target workspace, whichever one it is.

  - find_value: '# META\s+"default_lakehouse":\s*"([0-9a-fA-F-]{36})"'
    is_regex: "true"
    replace_value:
      _ALL_: "$items.Lakehouse.Sales.$id"
    item_type: "Notebook"
    item_name: "Load Sales"
    file_path: "/Load Sales.Notebook/notebook-content.py"

  - find_value: '# META\s+"default_lakehouse_workspace_id":\s*"([0-9a-fA-F-]{36})"'
    is_regex: "true"
    replace_value:
      _ALL_: "$workspace.$id"
    item_type: "Notebook"
    item_name: "Load Sales"
    file_path: "/Load Sales.Notebook/notebook-content.py"

  - find_value: '"known_lakehouses":\s*\[\s*# META\s+\{\s*# META\s+"id":\s*"([0-9a-fA-F-]{36})"'
    is_regex: "true"
    replace_value:
      _ALL_: "$items.Lakehouse.Sales.$id"
    item_type: "Notebook"
    item_name: "Load Sales"
    file_path: "/Load Sales.Notebook/notebook-content.py"
