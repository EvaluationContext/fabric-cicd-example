# main → DEV, then teardown
#
# Every merge to main that touches fabric/foo/ publishes the dev workspace.
# Prod is deploy-release.yml (release/* → test → plan → approval → prod).
#
# The path filter is deliberate: an edit to this file or its templates does not
# trigger a run, so a broken pipeline edit surfaces on the next content change.
# Add `.azure-pipelines/` to `paths` to change that, at the cost of a dev deploy
# per pipeline tweak.
#
# Dev is git-connected to main for one reason: the Fabric UI lists feature
# workspaces under the workspace they are related to, and the relation API
# needs both connected to the same repo root. This deploy is the only thing
# that publishes dev. NEVER update dev from git or commit from it: main holds
# the last feature workspace's ids in the places autobinding doesn't cover,
# and only a deploy rewrites them on the way in.
#
# The Teardown stage deletes feature workspaces whose branch is gone, and only
# this repo's: the name carries the repo slug, and the workspace's git connection
# must name this repo and a branch the remote no longer has. Completing a pull
# request deletes the source branch by default; leave that on.
#
# Prerequisites in Fabric: the dev workspace, named by `core.workspace.dev` in
# fabric/foo/config.yml, with the SPN as Contributor. Nothing here creates a
# workspace; a missing one fails the deploy naming it.
#
# Prerequisites in Azure DevOps: the workload-identity service connection in
# variables.yml and the `fabric-dev` environment (created on first run, no check).

trigger:
  # Two merges a minute apart must not publish dev concurrently. The second
  # waits and runs once for everything queued behind the first.
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - fabric/foo/

pr: none

variables:
  - template: variables.yml

stages:
  - stage: Dev
    displayName: Deploy to Dev
    jobs:
      - deployment: DeployDev
        displayName: fab deploy (dev)
        pool:
          vmImage: ubuntu-latest
        environment: fabric-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/fab-setup-steps.yml
                  parameters:
                    serviceConnection: ${{ variables.serviceConnectionDev }}

                - template: templates/fab-deploy-steps.yml
                  parameters:
                    targetEnv: dev

  - stage: Teardown
    displayName: Teardown feature workspaces
    dependsOn: Dev
    # Only a run on main may delete anything.
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: TeardownFeatureWorkspaces
        displayName: Delete workspaces for merged branches
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            persistCredentials: true   # git ls-remote against the repo

          - template: templates/fab-setup-steps.yml
            parameters:
              serviceConnection: ${{ variables.serviceConnectionDev }}

          - script: |
              set -euo pipefail
              slug() { printf '%s' "$1" | tr 'A-Z' 'a-z' | tr -cs 'a-z0-9' '-' | sed 's/^-//; s/-$//'; }
              # If in doubt, keep. A workspace is deleted only when every check below
              # passes; a failed check, an odd name or a failed git call keeps it.
              repo="$BUILD_REPOSITORY_NAME"
              prefix="foo-feature-$(slug "$repo")-"

              # Delete nothing unless the remote answers and still has main, so an
              # unreachable remote can never read as "every branch is gone".
              git ls-remote --exit-code --heads origin refs/heads/main >/dev/null

              # Only workspaces the SPN holds a role on come back, which is
              # why provisioning kept it Admin. Delete is Admin-only too.
              fab api workspaces |
                jq -r --arg p "$prefix" '.text.value[]
                  | select(.displayName | startswith($p)) | [.id, .displayName] | @tsv' |
              while IFS=$'\t' read -r wsId wsName; do
                conn=$(fab api "workspaces/$wsId/git/connection" </dev/null)
                connRepo=$(jq -r '.text.gitProviderDetails.repositoryName // empty' <<<"$conn")
                branch=$(jq -r '.text.gitProviderDetails.branchName // empty' <<<"$conn")

                # Every check must pass, or the workspace is kept.
                if [ "$connRepo" != "$repo" ]; then
                  echo "keep:   $wsName (connected to '$connRepo', not $repo)"; continue
                fi
                case "$branch" in
                  feature/?*) ;;
                  *) echo "keep:   $wsName ('$branch' is not a feature branch)"; continue ;;
                esac
                if [ "$wsName" != "$prefix$(slug "${branch#feature/}")" ]; then
                  echo "keep:   $wsName (not the workspace provisioned for $branch)"; continue
                fi

                # ls-remote exits 0 when the branch exists and 2 when it does not. Any
                # other code means the check failed, which is not an answer.
                rc=0
                git ls-remote --exit-code --heads origin "refs/heads/$branch" </dev/null >/dev/null || rc=$?
                case "$rc" in
                  0) echo "keep:   $wsName ($branch still exists)" ;;
                  2) echo "delete: $wsName ($branch is gone)"
                     fab api -X delete "workspaces/$wsId" </dev/null ;;
                  *) echo "##vso[task.logissue type=warning]kept $wsName: could not check $branch (git exit $rc)" ;;
                esac
              done
            displayName: Teardown
